<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>休暇予定入力アドイン</title>

    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
    <style>
      body {
        padding: 12px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      #app-body {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      #version {
        font-size: 12px;
        margin-bottom: 4px;
        margin-top: 0;
        text-align: left;
      }

      #instruction {
        font-size: 14px;
        font-weight: bold;
        text-align: left;
        margin-bottom: 4px;
      }

      .ms-Button {
        width: 100%;
      }

      #message {
        margin-top: 5px;
        color: red;
        font-weight: bold;
        text-align: center;
      }

      #oof-guide {
        margin-top: 16px;
      }

      .gif-pair {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }

      .gif-box {
        flex: 1 1 45%;
        text-align: center;
      }

      .gif-box p {
        font-weight: bold;
        margin-bottom: 6px;
      }

      .gif-box img {
        max-width: 100%;
        height: auto;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      .oof-media {
        max-width: 250px;
        width: 100%;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

    </style>
  </head>

  <body class="ms-font-m ms-welcome ms-Fabric">
    <div id="app-body">
      <p id="version">v1.0.0</p>

      <p id="instruction">取得する休暇の種類を選択してください</p>

      <button id="allDayButton" class="ms-Button ms-Button--primary">終日休暇</button>
      <button id="amHalfDayButton" class="ms-Button ms-Button--primary">AM半休</button>
      <button id="pmHalfDayButton" class="ms-Button ms-Button--primary">PM半休</button>

      <div id="message"></div>

      <div id="oof-guide" style="text-align: center; margin-top: 20px;">
        <p style="font-weight: bold;">手動で公開方法を変更してください</p>
        <div style="display: flex; justify-content: center; gap: 20px;">
          
          <!-- Classic Outlook -->
          <div>
            <p><strong>Outlook Classic</strong></p>
            <div style="position: relative; display: inline-block; transform: scale(0.5); transform-origin: top left;">
              <img id="classic-static" src="https://raw.githubusercontent.com/JAOSmatsuda/vacation-addin/main/assets/OOF_classic_1frame.png" 
                   alt="Classic Preview" style="max-width: 100%; border: 1px solid #ccc; border-radius: 8px;" class="oof-media">
              <img src="https://raw.githubusercontent.com/JAOSmatsuda/vacation-addin/main/assets/play_button.svg" 
                   alt="Play" onclick="playGif('classic')" 
                   style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(2); width: 40px; height: 40px; cursor: pointer;">
              <img id="classic-gif" src="https://raw.githubusercontent.com/JAOSmatsuda/vacation-addin/main/assets/OOF_classic.gif" 
                   style="display: none; max-width: 100%; border: 1px solid #ccc; border-radius: 8px;" class="oof-media">
            </div>            
      
          <!-- New Outlook -->
          <div>
            <p><strong>Outlook New</strong></p>
            <div style="position: relative; display: inline-block;">
              <img id="new-static" src="https://raw.githubusercontent.com/JAOSmatsuda/vacation-addin/main/assets/OOF_1frame.png" 
                   alt="New Preview" style="max-width: 100%; border: 1px solid #ccc; border-radius: 8px;" class="oof-media">
              <img src="https://raw.githubusercontent.com/JAOSmatsuda/vacation-addin/main/assets/play_button.svg" 
                   alt="Play" onclick="playGif('new')" 
                   style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; cursor: pointer;">
              <img id="new-gif" src="https://raw.githubusercontent.com/JAOSmatsuda/vacation-addin/main/assets/OOF.gif" 
                   style="display: none; max-width: 100%; border: 1px solid #ccc; border-radius: 8px;" class="oof-media">
            </div>
          </div>
      
        </div>
      </div>      

    <script>
      function playGif(type) {
        if (type === 'classic') {
          document.getElementById('classic-static').style.display = 'none';
          document.querySelector('#classic-static + img').style.display = 'none'; // play button
          document.getElementById('classic-gif').style.display = 'inline-block';
        } else if (type === 'new') {
          document.getElementById('new-static').style.display = 'none';
          document.querySelector('#new-static + img').style.display = 'none'; // play button
          document.getElementById('new-gif').style.display = 'inline-block';
        }
      }
    </script>

    <script type="module" src="taskpane.js"></script>
  </body>
</html>
