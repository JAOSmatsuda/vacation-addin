<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>休暇予定入力アドイン</title>

    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
    <style>
      body {
        padding: 12px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      #app-body {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      #version {
        font-size: 12px;
        margin-bottom: 4px;
        margin-top: 0;
        text-align: left;
      }

      #instruction {
        font-size: 14px;
        font-weight: bold;
        text-align: left;
        margin-bottom: 4px;
      }

      .ms-Button {
        width: 100%;
      }

      #message {
        margin-top: 5px;
        color: red;
        font-weight: bold;
        text-align: center;
      }

      #oof-guide {
        margin-top: 16px;
      }

      .gif-pair {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }

      .gif-box {
        flex: 1 1 45%;
        text-align: center;
      }

      .gif-box p {
        font-weight: bold;
        margin-bottom: 6px;
      }

      .gif-box img {
        max-width: 100%;
        height: auto;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
    </style>
  </head>

  <body class="ms-font-m ms-welcome ms-Fabric">
    <div id="app-body">
      <p id="version">v1.0.0</p>

      <p id="instruction">取得する休暇の種類を選択してください</p>

      <button id="allDayButton" class="ms-Button ms-Button--primary">終日休暇</button>
      <button id="amHalfDayButton" class="ms-Button ms-Button--primary">AM半休</button>
      <button id="pmHalfDayButton" class="ms-Button ms-Button--primary">PM半休</button>

      <div id="message"></div>

      <div id="oof-guide">
        <div class="gif-pair">
          <div class="gif-box">
            <p>New Outlookでの操作方法</p>
            <img src="https://raw.githubusercontent.com/JAOSmatsuda/vacation-addin/main/assets/OOF.gif" alt="New Outlook操作方法">
          </div>
          <div class="gif-box">
            <p>Classic Outlookでの操作方法</p>
            <img src="https://raw.githubusercontent.com/JAOSmatsuda/vacation-addin/main/assets/OOF_classic.gif" alt="Classic Outlook操作方法">
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="taskpane.js"></script>
  </body>
</html>
