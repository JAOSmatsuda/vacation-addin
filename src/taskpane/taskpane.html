<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>休暇予定入力アドイン</title>

    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
    <style>
      body {
        padding: 20px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      #app-body {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .ms-Button {
        width: 100%;
      }

      #title {
        font-size: 1.1em;
        font-weight: bold;
        text-align: center;
        margin: 0;
        padding: 0;
      }

      #version {
        margin: 0;
        text-align: center;
        font-size: 0.9em;
      }

      #message {
        margin-top: 5px;
        color: red;
        font-weight: bold;
        text-align: center;
      }
    </style>
  </head>

  <body class="ms-font-m ms-welcome ms-Fabric">
    <div id="app-body">
      <div id="title">休暇予定入力</div>
      <p id="version"></p>

      <button id="allDayButton" class="ms-Button ms-Button--primary">終日休暇</button>
      <button id="amHalfDayButton" class="ms-Button ms-Button--primary">AM半休</button>
      <button id="pmHalfDayButton" class="ms-Button ms-Button--primary">PM半休</button>

      <!-- ユーザー向け通知用 -->
      <div id="message"></div>

      <div id="oof-guide" style="text-align: center; margin-top: 20px;">
        <p style="font-weight: bold;">
          Outlook (new) の場合は、<br>公開方法を手動で「不在」にしてください。
        </p>
        <img src="https://raw.githubusercontent.com/JAOSmatsuda/vacation-addin/main/assets/OOF.gif" 
             alt="外出中の設定方法" 
             style="max-width: 100%; height: auto; border: 1px solid #ccc; border-radius: 8px;">
      </div>
    </div>

    <script type="module" src="taskpane.js"></script>
  </body>
</html>
